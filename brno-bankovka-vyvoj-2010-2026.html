<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8"><title>Skutečné výdaje Brna na tisícikoruně</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--fg:#1c1c1c;--mut:#4a4a4a;--line:#e3e3e3;--ctl:#e9e9e9;--ctlfg:#666}
*{box-sizing:border-box}html,body{margin:0}
body{background:#fff;color:var(--fg);font:15px/1.35 "IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;padding:14px 12px calc(10px + env(safe-area-inset-bottom,0px))}
h1{margin:6px 0 4px;font-weight:700;font-size:clamp(26px,5.4vw,40px);line-height:1.1;letter-spacing:.01em;text-transform:uppercase}
.sub{margin:0 0 20px;text-transform:uppercase;font-size:14px;color:var(--mut)}
.ctl{display:flex;gap:6px;align-items:stretch;margin-bottom:12px}
.ctl select{flex:1;font:inherit;font-size:16px;color:var(--ctlfg);text-align:center;text-align-last:center;padding:9px 8px;border:0;border-radius:3px;background:var(--ctl);cursor:pointer}
button{font:inherit;color:var(--ctlfg);min-width:40px;padding:0 12px;border:0;border-radius:3px;background:var(--ctl);cursor:pointer;font-size:18px}
button:hover,.ctl select:hover{background:#ddd}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #2f7f86;outline-offset:2px}
button[aria-pressed=true]{background:#45989c;color:#fff}
.note{overflow-x:auto}svg{display:block;width:100%;height:auto;min-width:560px}
.dim .strip:not(.on){opacity:.4}.strip{cursor:default;transition:opacity .15s}
#info{min-height:1.5em;margin:10px 0 4px;font-weight:600}
ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0 22px}
li{display:grid;grid-template-columns:12px 1fr auto;gap:8px;padding:5px 2px;border-bottom:1px solid var(--line)}
li i{width:12px;height:12px;border-radius:2px;align-self:center}li.on{background:#f4f4f4}li b{font-weight:600;font-variant-numeric:tabular-nums}
footer{margin-top:10px;color:#666;font-size:12.5px}
</style></head><body>
<div id="hd"><h1>Statutární město Brno</h1><p class="sub">Rozpočet v letech 2010–2026 · Kam peníze jdou</p></div>
<div class="ctl" id="ctl"><button id="prev" aria-label="Předchozí rok">‹</button><select id="sel" aria-label="Rok"></select><button id="next" aria-label="Další rok">›</button><button id="play" aria-label="Přehrát roky" aria-pressed="false">▶</button></div>
<div class="note"><svg id="svg" viewBox="0 0 1000 440" role="img" aria-label="Skutečné výdaje Brna na tisícikoruně"></svg></div>
<div id="info">&nbsp;</div><ul id="list"></ul>
<footer id="foot"></footer>
<script>
const DATA={"oblasti": [{"s": "Doprava", "n": "Doprava"}, {"s": "Státní správa a samospráva", "n": "Státní moc, státní správa, územní samospráva a politické strany"}, {"s": "Kultura a církve", "n": "Kultura, církve a sdělovací prostředky"}, {"s": "Bydlení a komunální služby", "n": "Bydlení, komunální služby a územní rozvoj"}, {"s": "Školství", "n": "Vzdělávání a školské služby"}, {"s": "Sport a volný čas", "n": "Sport a zájmová činnost"}, {"s": "Sociální služby", "n": "Sociální služby a společné činnosti v sociálním zabezpečení a politice zaměstnanosti"}, {"s": "Životní prostředí", "n": "Ochrana životního prostředí"}, {"s": "Vodní hospodářství", "n": "Vodní hospodářství"}, {"s": "Bezpečnost a pořádek", "n": "Bezpečnost a veřejný pořádek"}, {"s": "Finanční operace", "n": "Finanční operace"}, {"s": "Zdravotnictví", "n": "Zdravotnictví"}, {"s": "Ostatní činnosti", "n": "Ostatní činnosti"}, {"s": "Požární ochrana", "n": "Požární ochrana a integrovaný záchranný systém"}, {"s": "Průmysl a obchod", "n": "Průmysl, stavebnictví, obchod a služby"}, {"s": "Služby pro fyzické osoby", "n": "Ostatní činnosti související se službami pro fyzické osoby"}, {"s": "Výzkum a vývoj", "n": "Ostatní výzkum a vývoj"}, {"s": "Zemědělství a lesnictví", "n": "Zemědělství, lesní hospodářství a rybářství"}, {"s": "Jiné veřejné služby", "n": "Jiné veřejné služby a činnosti"}, {"s": "Dávky (jen 2010–2012)", "n": "Dávky a podpory v sociálním zabezpečení (jen 2010–2012)"}, {"s": "Mimo výběr (ostatní oddíly)", "n": "Ostatní oddíly mimo výběr"}], "roky": {"2010": [214.6, 114.8, 81.9, 109.3, 52.3, 44.4, 36.6, 53.0, 30.6, 27.0, 40.8, 19.2, 100.0, 2.1, 0.7, 0.0, 1.3, 1.4, 1.0, 69.1, 0.1], "2011": [206.9, 111.6, 89.1, 112.9, 74.1, 19.5, 36.7, 48.6, 35.1, 26.7, 34.6, 24.6, 102.9, 1.1, 0.7, 0.0, 1.3, 1.2, 1.8, 70.5, 0.1], "2012": [223.7, 133.5, 81.0, 115.8, 62.1, 24.3, 38.4, 52.4, 83.1, 29.6, 28.9, 12.4, 106.4, 1.0, 4.1, 0.0, 0.8, 1.3, 1.2, 0.0, 0.0], "2013": [220.7, 122.8, 75.6, 94.4, 54.9, 27.7, 35.1, 51.4, 111.7, 29.6, 33.5, 16.1, 116.9, 1.3, 4.2, 0.7, 0.8, 1.3, 1.1, 0.0, 0.2], "2014": [228.1, 119.0, 70.9, 102.5, 72.6, 39.7, 39.4, 61.3, 55.3, 29.1, 25.0, 23.6, 121.3, 3.5, 4.8, 0.7, 1.1, 1.1, 1.0, 0.0, 0.1], "2015": [279.0, 140.6, 90.1, 106.2, 74.7, 48.9, 65.3, 61.2, 34.6, 33.6, 26.2, 24.9, 0.3, 2.3, 4.9, 0.8, 3.9, 1.2, 1.3, 0.0, 0.0], "2016": [244.9, 143.8, 96.3, 122.1, 67.4, 37.1, 63.1, 57.3, 45.4, 35.0, 45.9, 23.7, 0.5, 3.1, 7.3, 1.1, 3.8, 0.9, 1.2, 0.0, 0.0], "2017": [235.5, 137.6, 107.1, 143.0, 77.8, 38.5, 63.9, 52.7, 46.2, 34.0, 24.3, 17.2, 3.7, 3.3, 8.3, 1.0, 4.0, 0.8, 1.1, 0.0, 0.0], "2018": [241.7, 129.9, 149.2, 103.5, 73.0, 45.9, 63.7, 49.5, 51.0, 31.2, 17.9, 26.0, 3.4, 1.8, 6.1, 1.3, 3.4, 0.7, 0.9, 0.0, 0.0], "2019": [255.7, 132.6, 108.0, 124.5, 77.7, 39.1, 73.5, 50.3, 45.6, 32.0, 17.3, 22.9, 4.1, 4.3, 3.6, 1.7, 4.2, 1.8, 1.1, 0.0, 0.1], "2020": [266.5, 129.7, 90.0, 100.2, 69.9, 36.1, 88.1, 47.0, 54.1, 28.9, 13.6, 27.1, 3.0, 3.9, 34.7, 1.2, 3.8, 0.7, 0.6, 0.0, 0.9], "2021": [288.7, 127.7, 99.8, 88.7, 63.3, 44.7, 88.3, 48.8, 55.4, 27.9, 13.1, 33.3, 2.8, 3.5, 7.4, 1.7, 2.3, 1.2, 0.7, 0.0, 1.1], "2022": [265.7, 128.9, 95.1, 97.5, 59.5, 55.4, 72.4, 71.9, 52.7, 27.3, 14.6, 22.8, 19.0, 3.6, 5.0, 2.0, 2.3, 1.2, 3.1, 0.0, 0.1], "2023": [272.0, 130.5, 95.2, 81.8, 71.6, 91.2, 67.6, 58.7, 44.9, 26.5, 14.9, 29.9, 3.0, 2.0, 4.2, 2.2, 1.8, 0.8, 0.9, 0.0, 0.1], "2024": [267.7, 142.5, 94.4, 81.1, 64.3, 80.3, 63.0, 78.9, 45.1, 27.2, 18.8, 19.9, 3.6, 3.0, 4.5, 1.9, 2.0, 1.0, 0.8, 0.0, 0.2], "2025": [256.3, 128.8, 92.9, 95.1, 66.2, 101.1, 71.1, 71.2, 44.0, 27.0, 15.9, 14.6, 2.7, 3.5, 3.9, 1.8, 1.9, 0.8, 0.9, 0.0, 0.2], "2026": [267.3, 126.3, 107.0, 80.1, 100.8, 53.4, 82.8, 55.8, 39.0, 27.4, 25.3, 15.4, 3.7, 4.6, 3.9, 2.0, 3.0, 0.7, 1.0, 0.0, 0.3]}};
const Q=new URLSearchParams(location.search),YRS=Object.keys(DATA.roky),O=DATA.oblasti;
const sel=document.getElementById('sel'),svg=document.getElementById('svg'),list=document.getElementById('list'),info=document.getElementById('info');
YRS.forEach(y=>sel.add(new Option(y==='2026'?'2026 (leden až srpen)':y,y)));
if(Q.get('ovladani')==='0')document.getElementById('ctl').style.display='none';
if(Q.get('nadpis')==='0')document.getElementById('hd').style.display='none';
let cur=YRS.includes(Q.get('rok'))?Q.get('rok'):YRS[YRS.length-2],timer=null;
/* barvy a barva písma shodné s grafy v Infogramu (treemapa a stacked) */
const C={red:['#e0454f','#fff'],green:['#5bbd84','#1c1c1c'],orange:['#e8891d','#1c1c1c'],blue:['#6ac6e6','#1c1c1c'],rose:['#d4637a','#fff'],purple:['#a06ad6','#fff'],gold:['#f2c14e','#1c1c1c'],teal:['#3d9a9a','#fff']};
const PAL=['red','green','orange','blue','red','green','rose','purple','orange','gold','blue','purple','rose','red','rose','blue','green','orange','teal','gold','teal'].map(k=>C[k]);
const fmt=v=>(v>=10?String(Math.round(v)):v.toFixed(1).replace('.',','))+' Kč';
function wrap(t,n){const w=t.split(' '),L=[];let c='';w.forEach(x=>{if((c+' '+x).trim().length>n&&c){L.push(c);c=x}else c=(c+' '+x).trim()});if(c)L.push(c);return L}
function bg(){let s='<rect width="1000" height="440" fill="#e9efe7"/>';
 for(let k=0;k<22;k++){let p='';for(let x=0;x<=1000;x+=8)p+=(x?'L':'M')+x+' '+(20+k*19+9*Math.sin(x*.03+k*.5)).toFixed(1);s+=`<path d="${p}" fill="none" stroke="#5f8a74" stroke-opacity=".28" stroke-width=".9"/>`}
 for(let R=24;R<=210;R+=9){let p='';for(let a=0;a<=6.30;a+=.04)p+=(a?'L':'M')+(640+(R+7*Math.sin(9*a+R*.2))*Math.cos(a)).toFixed(1)+' '+(220+(R+7*Math.sin(9*a+R*.2))*Math.sin(a)).toFixed(1);s+=`<path d="${p}" fill="none" stroke="#3f6f5a" stroke-opacity=".3" stroke-width=".9"/>`}
 s+='<text x="26" y="230" font-family="Georgia,serif" font-weight="900" font-size="190" fill="none" stroke="#3f6f5a" stroke-opacity=".45" stroke-width="2">1000</text><text x="974" y="426" text-anchor="end" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#2c5a47" fill-opacity=".7">VZOR · NENÍ PLATIDLEM</text>';return s}
function draw(){
 sel.value=cur;const V=DATA.roky[cur],W=1000,H=440;let x=0,s=bg();const tot=V.reduce((a,b)=>a+b,0);
 O.forEach((o,i)=>{const v=V[i];if(!(v>0))return;const w=v/tot*W,[fill,tc]=PAL[i%PAL.length],cx=x+w/2;
  s+=`<g class="strip" data-i="${i}"><title>${o.n}: ${v.toFixed(1).replace('.',',')} Kč z každých 1000 Kč</title><rect x="${x}" y="0" width="${w}" height="${H}" fill="${fill}" fill-opacity=".82" stroke="#fff" stroke-width="1.5"/>`;
  if(w>=120){const L=wrap(o.s,Math.max(8,Math.floor((w-14)/7.4)));L.forEach((l,k)=>s+=`<text x="${x+7}" y="${24+k*19}" font-size="16" fill="${tc}">${l}</text>`);s+=`<text x="${x+7}" y="${24+L.length*19}" font-size="16" font-weight="600" fill="${tc}">${fmt(v)}</text>`}
  else if(w>=26){const t=fmt(v)+' · '+(o.s.length>40?o.s.slice(0,38)+'…':o.s);s+=`<text transform="translate(${cx+5} ${H-12}) rotate(-90)" font-size="${w>44?15:13}" fill="${tc}"><tspan font-weight="600">${fmt(v)}</tspan> · ${o.s.length>40?o.s.slice(0,38)+'…':o.s}</text>`}
  s+='</g>';x+=w});
 svg.innerHTML=s;svg.style.fontFamily='"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif';
 list.innerHTML=O.map((o,i)=>V[i]>0?`<li data-i="${i}"><i style="background:${PAL[i%PAL.length][0]}"></i><span>${o.s}</span><b>${fmt(V[i])}</b></li>`:'').join('');
 const on=i=>{svg.classList.toggle('dim',i!=null);svg.querySelectorAll('.strip').forEach(e=>e.classList.toggle('on',e.dataset.i==i));list.querySelectorAll('li').forEach(e=>e.classList.toggle('on',e.dataset.i==i));info.innerHTML=i==null?'&nbsp;':`${O[i].n}: ${V[i].toFixed(1).replace('.',',')} Kč z každých 1000 Kč`};
 [...svg.querySelectorAll('.strip'),...list.querySelectorAll('li')].forEach(e=>{e.onmouseenter=()=>on(+e.dataset.i);e.onmouseleave=()=>on(null);e.onclick=()=>on(+e.dataset.i)});
 document.getElementById('foot').innerHTML='Zdroj: Monitor Státní pokladny, skutečné výdaje Statutárního města Brna podle odvětvového třídění. Šířka pruhu odpovídá podílu oblasti na každých 1000 Kč výdajů. Vizualizace není platidlem.'+(cur==='2026'?' Rok 2026 je neúplný (leden až srpen), podíly nejsou srovnatelné s celými roky.':'')+(+cur<=2012?' Do roku 2012 zahrnuje i dávky v sociálním zabezpečení, které se pak přestaly vykazovat.':'');
}
function go(d){const i=YRS.indexOf(cur)+d;if(i>=0&&i<YRS.length){cur=YRS[i];draw()}}
function stop(){clearInterval(timer);timer=null;const p=document.getElementById('play');p.setAttribute('aria-pressed','false');p.textContent='▶'}
document.getElementById('prev').onclick=()=>{stop();go(-1)};document.getElementById('next').onclick=()=>{stop();go(1)};
sel.onchange=()=>{stop();cur=sel.value;draw()};
document.getElementById('play').onclick=function(){if(timer)return stop();this.setAttribute('aria-pressed','true');this.textContent='❚❚';if(cur===YRS[YRS.length-1])cur=YRS[0];draw();timer=setInterval(()=>{if(YRS.indexOf(cur)>=YRS.length-1)return stop();go(1)},1300)};
draw();
function startAuto(){const p=document.getElementById('play');p.setAttribute('aria-pressed','true');p.textContent='❚❚';timer=setInterval(()=>{cur=YRS[(YRS.indexOf(cur)+1)%YRS.length];draw()},1600)}
if(Q.get('auto')==='1'&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches))startAuto();
if(window.self!==window.top){const a=document.createElement('a');a.href=location.origin+location.pathname;a.target='_blank';a.rel='noopener';a.textContent='Otevřít interaktivně v novém okně ↗';a.style.cssText='display:inline-block;margin-top:6px;color:#2f7f86;font-size:13px';document.body.appendChild(a)}
</script></body></html>
