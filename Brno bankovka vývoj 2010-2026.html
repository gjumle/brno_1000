<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8"><title>Skutečné výdaje Brna na tisícikoruně</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fff;--fg:#1d2733;--mut:#5c6673;--line:#d9d5cb;--red:#b3202a;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161b22;--fg:#e8e6e1;--mut:#9aa3ae;--line:#333c48}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 "IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;padding:8px 10px env(safe-area-inset-bottom,8px)}
.ctl{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.ctl select{flex:1;font:inherit;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
button{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:2px}
button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.note{overflow-x:auto}svg{display:block;width:100%;height:auto;min-width:560px;border-radius:5px}
.dim .strip:not(.on){opacity:.35}.strip{cursor:default;transition:opacity .15s}
#info{min-height:1.5em;margin:8px 0 4px;font-weight:600}
ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0 18px}
li{display:grid;grid-template-columns:12px 1fr auto;gap:8px;padding:4px 2px;border-bottom:1px solid var(--line)}
li i{width:12px;height:12px;border-radius:3px;align-self:center}li.on{background:rgba(179,32,42,.1)}li b{font-variant-numeric:tabular-nums}
footer{margin-top:8px;color:var(--mut);font-size:12.5px}
</style></head><body>
<div class="ctl" id="ctl"><button id="prev" aria-label="Předchozí rok">‹</button><select id="sel" aria-label="Rok"></select><button id="next" aria-label="Další rok">›</button><button id="play" aria-pressed="false">▶ Přehrát</button></div>
<div class="note"><svg id="svg" viewBox="0 0 1000 440" role="img" aria-label="Skutečné výdaje Brna na tisícikoruně"></svg></div>
<div id="info">&nbsp;</div><ul id="list"></ul>
<footer id="foot">Zdroj: Monitor Státní pokladny, výdaje Statutárního města Brna podle odvětvového třídění, skutečnost. Vizualizace není platidlem.</footer>
<script>
const DATA={"oblasti": [{"s": "Doprava", "n": "Doprava"}, {"s": "Státní správa a samospráva", "n": "Státní moc, státní správa, územní samospráva a politické strany"}, {"s": "Kultura a církve", "n": "Kultura, církve a sdělovací prostředky"}, {"s": "Bydlení a komunální služby", "n": "Bydlení, komunální služby a územní rozvoj"}, {"s": "Školství", "n": "Vzdělávání a školské služby"}, {"s": "Sport a volný čas", "n": "Sport a zájmová činnost"}, {"s": "Sociální služby", "n": "Sociální služby a společné činnosti v sociálním zabezpečení a politice zaměstnanosti"}, {"s": "Životní prostředí", "n": "Ochrana životního prostředí"}, {"s": "Vodní hospodářství", "n": "Vodní hospodářství"}, {"s": "Bezpečnost a pořádek", "n": "Bezpečnost a veřejný pořádek"}, {"s": "Finanční operace", "n": "Finanční operace"}, {"s": "Zdravotnictví", "n": "Zdravotnictví"}, {"s": "Ostatní činnosti", "n": "Ostatní činnosti"}, {"s": "Požární ochrana", "n": "Požární ochrana a integrovaný záchranný systém"}, {"s": "Průmysl a obchod", "n": "Průmysl, stavebnictví, obchod a služby"}, {"s": "Služby pro fyzické osoby", "n": "Ostatní činnosti související se službami pro fyzické osoby"}, {"s": "Výzkum a vývoj", "n": "Ostatní výzkum a vývoj"}, {"s": "Zemědělství a lesnictví", "n": "Zemědělství, lesní hospodářství a rybářství"}, {"s": "Jiné veřejné služby", "n": "Jiné veřejné služby a činnosti"}, {"s": "Dávky (jen 2010–2012)", "n": "Dávky a podpory v sociálním zabezpečení (jen 2010–2012)"}, {"s": "Mimo výběr (ostatní oddíly)", "n": "Ostatní oddíly mimo výběr"}], "roky": {"2010": [214.6, 114.8, 81.9, 109.3, 52.3, 44.4, 36.6, 53.0, 30.6, 27.0, 40.8, 19.2, 100.0, 2.1, 0.7, 0.0, 1.3, 1.4, 1.0, 69.1, 0.1], "2011": [206.9, 111.6, 89.1, 112.9, 74.1, 19.5, 36.7, 48.6, 35.1, 26.7, 34.6, 24.6, 102.9, 1.1, 0.7, 0.0, 1.3, 1.2, 1.8, 70.5, 0.1], "2012": [223.7, 133.5, 81.0, 115.8, 62.1, 24.3, 38.4, 52.4, 83.1, 29.6, 28.9, 12.4, 106.4, 1.0, 4.1, 0.0, 0.8, 1.3, 1.2, 0.0, 0.0], "2013": [220.7, 122.8, 75.6, 94.4, 54.9, 27.7, 35.1, 51.4, 111.7, 29.6, 33.5, 16.1, 116.9, 1.3, 4.2, 0.7, 0.8, 1.3, 1.1, 0.0, 0.2], "2014": [228.1, 119.0, 70.9, 102.5, 72.6, 39.7, 39.4, 61.3, 55.3, 29.1, 25.0, 23.6, 121.3, 3.5, 4.8, 0.7, 1.1, 1.1, 1.0, 0.0, 0.1], "2015": [279.0, 140.6, 90.1, 106.2, 74.7, 48.9, 65.3, 61.2, 34.6, 33.6, 26.2, 24.9, 0.3, 2.3, 4.9, 0.8, 3.9, 1.2, 1.3, 0.0, 0.0], "2016": [244.9, 143.8, 96.3, 122.1, 67.4, 37.1, 63.1, 57.3, 45.4, 35.0, 45.9, 23.7, 0.5, 3.1, 7.3, 1.1, 3.8, 0.9, 1.2, 0.0, 0.0], "2017": [235.5, 137.6, 107.1, 143.0, 77.8, 38.5, 63.9, 52.7, 46.2, 34.0, 24.3, 17.2, 3.7, 3.3, 8.3, 1.0, 4.0, 0.8, 1.1, 0.0, 0.0], "2018": [241.7, 129.9, 149.2, 103.5, 73.0, 45.9, 63.7, 49.5, 51.0, 31.2, 17.9, 26.0, 3.4, 1.8, 6.1, 1.3, 3.4, 0.7, 0.9, 0.0, 0.0], "2019": [255.7, 132.6, 108.0, 124.5, 77.7, 39.1, 73.5, 50.3, 45.6, 32.0, 17.3, 22.9, 4.1, 4.3, 3.6, 1.7, 4.2, 1.8, 1.1, 0.0, 0.1], "2020": [266.5, 129.7, 90.0, 100.2, 69.9, 36.1, 88.1, 47.0, 54.1, 28.9, 13.6, 27.1, 3.0, 3.9, 34.7, 1.2, 3.8, 0.7, 0.6, 0.0, 0.9], "2021": [288.7, 127.7, 99.8, 88.7, 63.3, 44.7, 88.3, 48.8, 55.4, 27.9, 13.1, 33.3, 2.8, 3.5, 7.4, 1.7, 2.3, 1.2, 0.7, 0.0, 1.1], "2022": [265.7, 128.9, 95.1, 97.5, 59.5, 55.4, 72.4, 71.9, 52.7, 27.3, 14.6, 22.8, 19.0, 3.6, 5.0, 2.0, 2.3, 1.2, 3.1, 0.0, 0.1], "2023": [272.0, 130.5, 95.2, 81.8, 71.6, 91.2, 67.6, 58.7, 44.9, 26.5, 14.9, 29.9, 3.0, 2.0, 4.2, 2.2, 1.8, 0.8, 0.9, 0.0, 0.1], "2024": [267.7, 142.5, 94.4, 81.1, 64.3, 80.3, 63.0, 78.9, 45.1, 27.2, 18.8, 19.9, 3.6, 3.0, 4.5, 1.9, 2.0, 1.0, 0.8, 0.0, 0.2], "2025": [256.3, 128.8, 92.9, 95.1, 66.2, 101.1, 71.1, 71.2, 44.0, 27.0, 15.9, 14.6, 2.7, 3.5, 3.9, 1.8, 1.9, 0.8, 0.9, 0.0, 0.2], "2026": [267.3, 126.3, 107.0, 80.1, 100.8, 53.4, 82.8, 55.8, 39.0, 27.4, 25.3, 15.4, 3.7, 4.6, 3.9, 2.0, 3.0, 0.7, 1.0, 0.0, 0.3]}};
const Q=new URLSearchParams(location.search),YRS=Object.keys(DATA.roky),O=DATA.oblasti;
const sel=document.getElementById('sel'),svg=document.getElementById('svg'),list=document.getElementById('list'),info=document.getElementById('info');
YRS.forEach(y=>sel.add(new Option(y==='2026'?'2026 (leden až srpen)':y,y)));
if(Q.get('ovladani')==='0')document.getElementById('ctl').style.display='none';
let cur=YRS.includes(Q.get('rok'))?Q.get('rok'):YRS[YRS.length-2],timer=null;
const hue=i=>(i*37+350)%360,fmt=v=>v.toLocaleString('cs-CZ',{minimumFractionDigits:1,maximumFractionDigits:1})+' Kč';
function draw(){
 sel.value=cur;const V=DATA.roky[cur],X0=30,W=940,Y0=78,H=282;let x=X0,s='';
 const tot=V.reduce((a,b)=>a+b,0);
 s+=`<rect width="1000" height="440" fill="#e6ece4"/><rect x="8" y="8" width="984" height="424" fill="none" stroke="#b3202a" stroke-width="3"/><rect x="16" y="16" width="968" height="408" fill="none" stroke="#1d2733" stroke-width=".8"/>`;
 s+=`<text x="30" y="60" font-family="Georgia,serif" font-weight="900" font-size="44" fill="#b3202a">1000</text><text x="970" y="60" text-anchor="end" font-family="Georgia,serif" font-weight="900" font-size="44" fill="#b3202a">1000</text><text x="500" y="40" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="22" fill="#1d2733">STATUTÁRNÍ MĚSTO BRNO</text><text x="500" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#1d2733">SKUTEČNÉ VÝDAJE ${cur==='2026'?'2026 (LEDEN–SRPEN)':cur}</text>`;
 O.forEach((o,i)=>{const v=V[i];if(!(v>0))return;const w=v/tot*W,cx=x+w/2;let g='';
  for(let k=0;k<14;k++){let p='';for(let px=0;px<=w+3;px+=3){const y=Y0+H*(k/13)+9*Math.sin(px*(.05+i*.006)+k*.55+i)*Math.cos(k*.4);p+=(px?'L':'M')+(x+px).toFixed(1)+' '+y.toFixed(1)}g+=`<path d="${p}" fill="none" stroke="#000" stroke-opacity=".16" stroke-width=".8"/>`}
  s+=`<g class="strip" data-i="${i}"><title>${o.n}: ${fmt(v)}</title><clipPath id="c${i}"><rect x="${x}" y="${Y0}" width="${w}" height="${H}"/></clipPath><rect x="${x}" y="${Y0}" width="${w}" height="${H}" fill="hsl(${hue(i)} 42% 72%)" stroke="#1d2733" stroke-width=".8"/><g clip-path="url(#c${i})">${g}</g>`;
  if(w>=58)s+=`<text x="${cx}" y="${Y0+30}" text-anchor="middle" font-family="Georgia,serif" font-weight="900" font-size="${w>110?26:17}" fill="#111">${fmt(v).replace(' Kč','')} Kč</text>`;
  else if(w>=30)s+=`<text x="${cx}" y="${Y0+26}" text-anchor="middle" font-family="Georgia,serif" font-weight="900" font-size="15" fill="#111">${Math.round(v)}</text>`;
  if(w>=26)s+=`<text transform="translate(${cx+5} ${Y0+H-12}) rotate(-90)" font-family="Arial,sans-serif" font-weight="600" font-size="${w>60?15:12}" fill="#111">${o.s}</text>`;
  s+='</g>';x+=w});
 s+=`<text x="970" y="392" text-anchor="end" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#b3202a">VZOR · NENÍ PLATIDLEM</text><text x="30" y="392" font-family="Arial,sans-serif" font-size="15" fill="#1d2733">Z každé tisícovky výdajů města: šířka pruhu = podíl oblasti</text>`;
 svg.innerHTML=s;
 list.innerHTML=O.map((o,i)=>V[i]>0?`<li data-i="${i}"><i style="background:hsl(${hue(i)} 42% 62%)"></i><span>${o.s}</span><b>${fmt(V[i])}</b></li>`:'').join('');
 const on=i=>{svg.classList.toggle('dim',i!=null);svg.querySelectorAll('.strip').forEach(e=>e.classList.toggle('on',e.dataset.i==i));list.querySelectorAll('li').forEach(e=>e.classList.toggle('on',e.dataset.i==i));info.innerHTML=i==null?'&nbsp;':`${O[i].n}: ${fmt(V[i])} z každých 1000 Kč`};
 [...svg.querySelectorAll('.strip'),...list.querySelectorAll('li')].forEach(e=>{e.onmouseenter=()=>on(+e.dataset.i);e.onmouseleave=()=>on(null);e.onclick=()=>on(+e.dataset.i)});
 document.getElementById('foot').innerHTML='Zdroj: Monitor Státní pokladny, výdaje Statutárního města Brna podle odvětvového třídění, skutečnost. Vizualizace není platidlem.'+(cur==='2026'?' Rok 2026 je neúplný (leden až srpen), podíly nejsou srovnatelné s celými roky.':'')+(+cur<=2012?' Do roku 2012 zahrnuje i dávky v sociálním zabezpečení, které se pak přestaly vykazovat.':'');
}
function go(d){const i=YRS.indexOf(cur)+d;if(i>=0&&i<YRS.length){cur=YRS[i];draw()}}
function stop(){clearInterval(timer);timer=null;const p=document.getElementById('play');p.setAttribute('aria-pressed','false');p.textContent='▶ Přehrát'}
document.getElementById('prev').onclick=()=>{stop();go(-1)};document.getElementById('next').onclick=()=>{stop();go(1)};
sel.onchange=()=>{stop();cur=sel.value;draw()};
document.getElementById('play').onclick=function(){if(timer)return stop();this.setAttribute('aria-pressed','true');this.textContent='❚❚ Pauza';if(cur===YRS[YRS.length-1])cur=YRS[0];draw();timer=setInterval(()=>{if(YRS.indexOf(cur)>=YRS.length-1)return stop();go(1)},1300)};
draw();
</script></body></html>
